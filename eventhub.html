<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NSBM EventHub</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#F5F0E3; --surface:#FFFFFF; --ink:#221F19; --ink-soft:#645D4D;
    --pine:#1E3B2E; --pine-light:#2E5443; --pine-deep:#12261D;
    --amber:#D98A3D; --amber-deep:#9C5F22; --amber-soft:#F5DDBB;
    --sage-soft:#E4EBDE; --coral:#B84D3E; --coral-soft:#F3DCD6; --line:#E3D8BE;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);}
  h1,h2,h3,h4{font-family:'Fraunces',serif;margin:0;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{font-family:'Inter',sans-serif;cursor:pointer;}
  input,select,textarea{font-family:'Inter',sans-serif;font-size:14px;padding:9px 11px;border-radius:7px;border:1.5px solid var(--line);background:#FFFEFA;color:var(--ink);outline:none;width:100%;box-sizing:border-box;}
  textarea{resize:vertical;min-height:64px;}

  /* ---- login ---- */
  #login-screen{min-height:100vh;background:var(--pine);display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-card{display:flex;width:100%;max-width:780px;background:var(--bg);border-radius:18px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,0.25);}
  .login-hero{flex:0 0 45%;background:linear-gradient(160deg,var(--pine-deep),var(--pine-light));color:#F5F0E3;padding:38px 32px;display:flex;flex-direction:column;justify-content:space-between;}
  .login-hero .eyebrow{font-size:12px;letter-spacing:.1em;opacity:.75;margin-bottom:10px;}
  .login-hero h1{font-size:34px;font-weight:600;line-height:1.12;}
  .login-hero p{font-size:14px;opacity:.85;margin-top:14px;line-height:1.6;}
  .login-hero .quote{border-top:1px solid rgba(245,240,227,.2);padding-top:16px;font-size:12.5px;opacity:.7;font-style:italic;font-family:'Fraunces',serif;}
  .login-form{flex:1;padding:38px 32px;}
  .role-toggle{display:flex;gap:8px;margin-bottom:18px;}
  .role-toggle button{flex:1;padding:9px 0;border-radius:8px;border:1.5px solid var(--line);background:transparent;color:var(--ink-soft);font-weight:600;font-size:13px;text-transform:capitalize;}
  .role-toggle button.active{border-color:var(--pine);background:var(--pine);color:#F5F0E3;}
  .field{display:block;margin-bottom:14px;}
  .field-label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);margin-bottom:5px;}
  .error-text{color:var(--coral);font-size:13px;margin:0 0 12px;}
  .hint-text{font-size:12px;color:var(--ink-soft);margin-top:14px;line-height:1.5;}

  /* ---- buttons ---- */
  .btn{font-weight:600;font-size:14px;padding:10px 20px;border-radius:8px;border:1.5px solid transparent;letter-spacing:.01em;}
  .btn.small{font-size:13px;padding:7px 14px;}
  .btn-primary{background:var(--amber);color:#2B1B08;border-color:var(--amber);}
  .btn-dark{background:var(--pine);color:#F5F0E3;border-color:var(--pine);width:100%;margin-top:6px;}
  .btn-ghost{background:transparent;color:var(--pine);border-color:var(--line);}
  .btn-danger{background:transparent;color:var(--coral);border-color:var(--coral-soft);}
  .btn:active{transform:scale(.97);}
  .btn[disabled]{opacity:.5;pointer-events:none;}

  /* ---- app shell ---- */
  #app-screen{display:none;}
  .topbar{background:var(--pine);color:#F5F0E3;}
  .topbar-inner{max-width:1100px;margin:0 auto;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;}
  .brand{display:flex;align-items:baseline;gap:10px;}
  .brand-name{font-family:'Fraunces',serif;font-size:20px;font-weight:600;}
  .brand-sub{font-size:11px;opacity:.65;letter-spacing:.05em;}
  .who{display:flex;align-items:center;gap:14px;}
  .who-name{font-size:13.5px;font-weight:600;text-align:right;}
  .who-role{font-size:11.5px;opacity:.7;text-transform:capitalize;text-align:right;}
  .signout{background:transparent;border:1.5px solid rgba(245,240,227,.35);color:#F5F0E3;border-radius:7px;padding:7px 13px;font-size:12.5px;font-weight:600;}
  .layout{max-width:1100px;margin:0 auto;padding:28px 24px 60px;display:flex;gap:26px;}
  .sidenav{width:190px;flex-shrink:0;}
  .sidenav-label{font-size:11px;letter-spacing:.08em;color:var(--ink-soft);text-transform:uppercase;margin-bottom:10px;}
  .nav-btn{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:8px;border:none;background:transparent;color:var(--ink-soft);font-weight:500;font-size:13.5px;border-left:3px solid transparent;margin-bottom:3px;}
  .nav-btn.active{background:var(--surface);color:var(--pine);font-weight:600;border-left:3px solid var(--amber);}
  .main-col{flex:1;min-width:0;}

  .section-header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px;gap:12px;flex-wrap:wrap;}
  .section-eyebrow{font-size:11px;letter-spacing:.08em;color:var(--amber-deep);text-transform:uppercase;margin-bottom:4px;}
  .section-title{font-size:24px;font-weight:600;}

  .badge{display:inline-block;font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:999px;font-weight:500;}
  .badge-pine{background:var(--sage-soft);color:var(--pine-deep);}
  .badge-amber{background:var(--amber-soft);color:var(--amber-deep);}

  .empty-state{border:1.5px dashed var(--line);border-radius:12px;padding:30px 20px;text-align:center;color:var(--ink-soft);font-size:14px;}

  /* ---- ticket card ---- */
  .ticket{display:flex;background:var(--surface);border-radius:14px;border:1.5px solid var(--line);position:relative;margin-bottom:14px;}
  .ticket-stub{width:84px;flex-shrink:0;background:var(--pine);color:#F5F0E3;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:14px 0 0 14px;position:relative;}
  .ticket-stub .month{font-size:12px;letter-spacing:.08em;opacity:.75;}
  .ticket-stub .day{font-family:'Fraunces',serif;font-size:30px;font-weight:600;line-height:1;}
  .ticket-stub .time{font-size:11px;opacity:.75;margin-top:4px;}
  .notch{position:absolute;right:-7px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:1.5px solid var(--line);}
  .notch.top{top:-7px;} .notch.bottom{bottom:-7px;}
  .perf{position:absolute;right:0;top:8px;bottom:8px;border-right:1.5px dashed rgba(245,240,227,.35);}
  .ticket-body{flex:1;padding:14px 18px;min-width:0;}
  .ticket-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .ticket-title{font-size:18px;font-weight:600;margin:0 0 4px;}
  .ticket-meta{font-size:13px;color:var(--ink-soft);display:flex;flex-wrap:wrap;gap:4px 10px;}
  .ticket-desc{font-size:13.5px;color:var(--ink-soft);margin:10px 0 0;line-height:1.55;}
  .ticket-footer{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap;}
  .ticket-footer .spacer{flex:1;}
  .ticket-info{font-size:12.5px;color:var(--ink-soft);}
  .ticket-info.warn{color:var(--coral);}

  /* ---- forms / panels ---- */
  .panel{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:20px;margin-bottom:22px;}
  .panel h3{font-size:17px;font-weight:600;margin-bottom:14px;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;}

  .list-row{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:11px 16px;margin-bottom:8px;}
  .list-row-name{font-weight:600;font-size:14px;}
  .list-row-count{font-size:12px;color:var(--ink-soft);margin-left:10px;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead tr{background:var(--sage-soft);text-align:left;}
  th{padding:10px 16px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--pine-deep);font-weight:600;}
  td{padding:10px 16px;}
  tbody tr{border-top:1px solid var(--line);}
  .table-wrap{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;overflow:hidden;}

  .announcement{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:12px;}
  .announcement-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .announcement h4{font-size:15.5px;font-weight:600;margin-bottom:4px;}
  .announcement .date{font-size:11.5px;color:var(--ink-soft);}
  .announcement p{font-size:13.5px;color:var(--ink-soft);margin:8px 0 0;line-height:1.55;}

  .filters-row{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
  .filters-row input{max-width:260px;}
  .filters-row select{width:180px;}

  ol.participant-list{margin:0;padding-left:20px;font-size:14px;line-height:2;}
  .participant-email{color:var(--ink-soft);font-size:12.5px;}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <div class="login-hero">
      <div>
        <div class="eyebrow mono">NSBM UNIVERSITY</div>
        <h1>EventHub</h1>
        <p>Plan, publish, and register for every club event on campus — all in one place.</p>
      </div>
      <div class="quote">Every ticket tells you where to be next.</div>
    </div>
    <form class="login-form" id="login-form">
      <h2 style="font-size:20px;font-weight:600;margin-bottom:18px;">Sign in</h2>
      <div class="role-toggle">
        <button type="button" class="active" data-role="student">student</button>
        <button type="button" data-role="admin">admin</button>
      </div>
      <label class="field">
        <span class="field-label" id="name-label">Full name</span>
        <input id="login-name" placeholder="e.g. Nadeesha Perera">
      </label>
      <label class="field">
        <span class="field-label">Email</span>
        <input id="login-email" placeholder="you@nsbm.ac.lk">
      </label>
      <p class="error-text" id="login-error" style="display:none;"></p>
      <button type="submit" class="btn btn-dark" id="login-submit">Continue to EventHub</button>
      <p class="hint-text">Prototype login — any name and email will do.</p>
    </form>
  </div>
</div>

<div id="app-screen">
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-name">EventHub</span>
        <span class="brand-sub mono">NSBM UNIVERSITY</span>
      </div>
      <div class="who">
        <div>
          <div class="who-name" id="who-name"></div>
          <div class="who-role" id="who-role"></div>
        </div>
        <button class="signout" id="signout-btn">Sign out</button>
      </div>
    </div>
  </div>
  <div class="layout">
    <div class="sidenav">
      <div class="sidenav-label" id="nav-label">Admin</div>
      <div id="nav-buttons"></div>
    </div>
    <div class="main-col" id="main-col"></div>
  </div>
</div>

<script>
/* ---------------- state ---------------- */
const uid = (p) => `${p}-${Math.random().toString(36).slice(2,9)}`;

let session = null;
let selectedRole = "student";

let categories = ["Workshop","Cultural","Sports","Tech","Career","Social"];

let events = [
  {id:"ev-1",title:"Freshers' Welcome Night",category:"Social",date:"2026-09-04",time:"18:00",venue:"Auditorium A",capacity:300,description:"Kick off the semester with games, food stalls, and performances from every club on campus.",club:"Student Council"},
  {id:"ev-2",title:"Hackathon: Build for Good",category:"Tech",date:"2026-09-20",time:"09:00",venue:"Innovation Lab",capacity:80,description:"24-hour build sprint for teams tackling a real campus problem. Prizes for top three teams.",club:"Computing Society"},
  {id:"ev-3",title:"Inter-Faculty Futsal Cup",category:"Sports",date:"2026-09-27",time:"15:30",venue:"Sports Complex",capacity:150,description:"Faculties face off in a knockout futsal tournament. Come cheer your team on.",club:"Sports Union"},
  {id:"ev-4",title:"Resume & LinkedIn Clinic",category:"Career",date:"2026-10-02",time:"13:00",venue:"Seminar Room 4",capacity:40,description:"Drop-in clinic with the careers team — bring a laptop and leave with a sharper profile.",club:"Careers Office"},
  {id:"ev-5",title:"Cultural Night: Colours of Asia",category:"Cultural",date:"2026-10-11",time:"17:30",venue:"Open Grounds",capacity:250,description:"An evening of dance, music, and food representing the diversity of our student body.",club:"Cultural Society"}
];

let announcements = [
  {id:uid("an"),title:"Registrations open for Hackathon",body:"Team sign-ups close 18 Sept. Max 4 members per team.",date:"2026-08-20"},
  {id:uid("an"),title:"Venue change: Cultural Night",body:"Moved to the Open Grounds due to expected turnout.",date:"2026-08-18"}
];

let registrations = []; // {id, eventId, studentName, studentEmail}

let adminTab = "events";
let studentTab = "browse";
let editingEventId = null; // null | "new" | eventId

const ADMIN_TABS = [
  {key:"events",label:"Events"},
  {key:"categories",label:"Categories"},
  {key:"registrations",label:"Registrations"},
  {key:"announcements",label:"Announcements"},
  {key:"participants",label:"Participant lists"}
];
const STUDENT_TABS = [
  {key:"browse",label:"Browse events"},
  {key:"schedule",label:"My schedule"},
  {key:"announcements",label:"Announcements"}
];

/* ---------------- helpers ---------------- */
function formatDate(d){
  const dt = new Date(d+"T00:00:00");
  return dt.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
}
function monthAbbr(d){ return new Date(d+"T00:00:00").toLocaleDateString("en-GB",{month:"short"}).toUpperCase(); }
function dayNum(d){ return new Date(d+"T00:00:00").getDate(); }
function catTone(cat){ return categories.indexOf(cat) % 2 === 0 ? "pine" : "amber"; }
function esc(s){ const d=document.createElement("div"); d.textContent = s==null?"":s; return d.innerHTML; }

function ticketCardHTML(ev, footerHTML){
  return `
  <div class="ticket">
    <div class="ticket-stub">
      <div class="month mono">${monthAbbr(ev.date)}</div>
      <div class="day">${dayNum(ev.date)}</div>
      <div class="time mono">${esc(ev.time)}</div>
      <div class="notch top"></div>
      <div class="notch bottom"></div>
      <div class="perf"></div>
    </div>
    <div class="ticket-body">
      <div class="ticket-top">
        <div>
          <h3 class="ticket-title">${esc(ev.title)}</h3>
          <div class="ticket-meta"><span>${esc(ev.venue)}</span><span>&middot;</span><span>${esc(ev.club)}</span></div>
        </div>
        <span class="badge badge-${catTone(ev.category)}">${esc(ev.category)}</span>
      </div>
      ${ev.description ? `<p class="ticket-desc">${esc(ev.description)}</p>` : ""}
      ${footerHTML ? `<div class="ticket-footer">${footerHTML}</div>` : ""}
    </div>
  </div>`;
}

function regCount(eventId){ return registrations.filter(r=>r.eventId===eventId).length; }

/* ---------------- login ---------------- */
document.querySelectorAll(".role-toggle button").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".role-toggle button").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    selectedRole = btn.dataset.role;
    document.getElementById("name-label").textContent = selectedRole==="admin" ? "Admin name" : "Full name";
    document.getElementById("login-submit").textContent = selectedRole==="admin" ? "Enter admin dashboard" : "Continue to EventHub";
  });
});

document.getElementById("login-form").addEventListener("submit", (e)=>{
  e.preventDefault();
  const name = document.getElementById("login-name").value.trim();
  const email = document.getElementById("login-email").value.trim();
  const errEl = document.getElementById("login-error");
  if(!name || !email){
    errEl.textContent = "Enter your name and email to continue.";
    errEl.style.display = "block";
    return;
  }
  errEl.style.display = "none";
  session = {role:selectedRole, name, email};
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("app-screen").style.display = "block";
  renderShell();
});

document.getElementById("signout-btn").addEventListener("click", ()=>{
  session = null;
  document.getElementById("app-screen").style.display = "none";
  document.getElementById("login-screen").style.display = "flex";
  document.getElementById("login-form").reset();
});

/* ---------------- shell / nav ---------------- */
function renderShell(){
  document.getElementById("who-name").textContent = session.name;
  document.getElementById("who-role").textContent = session.role;
  document.getElementById("nav-label").textContent = session.role === "admin" ? "Admin" : "Student";

  const tabs = session.role === "admin" ? ADMIN_TABS : STUDENT_TABS;
  const activeTab = session.role === "admin" ? adminTab : studentTab;
  const navEl = document.getElementById("nav-buttons");
  navEl.innerHTML = tabs.map(t => `<button class="nav-btn ${t.key===activeTab?'active':''}" data-tab="${t.key}">${t.label}</button>`).join("");
  navEl.querySelectorAll(".nav-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      if(session.role==="admin") adminTab = btn.dataset.tab; else studentTab = btn.dataset.tab;
      editingEventId = null;
      renderShell();
    });
  });

  renderMain();
}

function renderMain(){
  const el = document.getElementById("main-col");
  if(session.role === "admin"){
    if(adminTab==="events") el.innerHTML = adminEventsHTML();
    else if(adminTab==="categories") el.innerHTML = adminCategoriesHTML();
    else if(adminTab==="registrations") el.innerHTML = adminRegistrationsHTML();
    else if(adminTab==="announcements") el.innerHTML = adminAnnouncementsHTML();
    else if(adminTab==="participants") el.innerHTML = adminParticipantsHTML();
  } else {
    if(studentTab==="browse") el.innerHTML = studentBrowseHTML();
    else if(studentTab==="schedule") el.innerHTML = studentScheduleHTML();
    else if(studentTab==="announcements") el.innerHTML = studentAnnouncementsHTML();
  }
  attachMainHandlers();
}

/* ---------------- admin: events ---------------- */
function emptyEventForm(){
  return {title:"",category:categories[0]||"",date:"",time:"",venue:"",capacity:50,description:"",club:""};
}
let eventForm = emptyEventForm();
let eventFormError = "";

function adminEventsHTML(){
  let formHTML = "";
  if(editingEventId){
    const isNew = editingEventId === "new";
    formHTML = `
    <div class="panel">
      <h3>${isNew ? "New event" : "Edit event"}</h3>
      <div class="form-grid">
        <label class="field"><span class="field-label">Title</span><input id="f-title" value="${esc(eventForm.title)}" placeholder="Freshers' Welcome Night"></label>
        <label class="field"><span class="field-label">Organising club</span><input id="f-club" value="${esc(eventForm.club)}" placeholder="Student Council"></label>
        <label class="field"><span class="field-label">Category</span>
          <select id="f-category">${categories.map(c=>`<option value="${esc(c)}" ${c===eventForm.category?"selected":""}>${esc(c)}</option>`).join("")}</select>
        </label>
        <label class="field"><span class="field-label">Capacity</span><input id="f-capacity" type="number" min="1" value="${esc(eventForm.capacity)}"></label>
        <label class="field"><span class="field-label">Date</span><input id="f-date" type="date" value="${esc(eventForm.date)}"></label>
        <label class="field"><span class="field-label">Time</span><input id="f-time" type="time" value="${esc(eventForm.time)}"></label>
        <label class="field"><span class="field-label">Venue</span><input id="f-venue" value="${esc(eventForm.venue)}" placeholder="Auditorium A"></label>
      </div>
      <label class="field"><span class="field-label">Description</span><textarea id="f-description" placeholder="What should students expect?">${esc(eventForm.description)}</textarea></label>
      ${eventFormError ? `<p class="error-text">${esc(eventFormError)}</p>` : ""}
      <div style="display:flex;gap:10px;">
        <button class="btn btn-primary" id="f-save">${isNew ? "Create event" : "Save changes"}</button>
        <button class="btn btn-ghost" id="f-cancel">Cancel</button>
      </div>
    </div>`;
  }

  const cards = events.length === 0
    ? `<div class="empty-state">No events yet. Create your first event to get started.</div>`
    : events.map(ev => ticketCardHTML(ev, `
        <span class="ticket-info mono">${regCount(ev.id)} / ${ev.capacity} registered</span>
        <div class="spacer"></div>
        <button class="btn small btn-ghost" data-edit="${ev.id}">Edit</button>
        <button class="btn small btn-danger" data-delete="${ev.id}">Delete</button>
      `)).join("");

  return `
    <div class="section-header">
      <div><div class="section-eyebrow mono">Manage</div><h2 class="section-title">Events</h2></div>
      <button class="btn btn-primary" id="new-event-btn">+ New event</button>
    </div>
    ${formHTML}
    ${cards}
  `;
}

/* ---------------- admin: categories ---------------- */
let categoryError = "";
function adminCategoriesHTML(){
  const rows = categories.map(cat=>{
    const count = events.filter(e=>e.category===cat).length;
    return `
    <div class="list-row">
      <div><span class="list-row-name">${esc(cat)}</span><span class="list-row-count mono">${count} event${count===1?"":"s"}</span></div>
      <button class="btn small btn-danger" data-remove-cat="${esc(cat)}">Remove</button>
    </div>`;
  }).join("");

  return `
    <div class="section-header"><div><div class="section-eyebrow mono">Manage</div><h2 class="section-title">Event categories</h2></div></div>
    <div style="display:flex;gap:10px;margin-bottom:20px;max-width:420px;">
      <input id="new-cat-name" placeholder="e.g. Wellness">
      <button class="btn small btn-primary" id="add-cat-btn">Add</button>
    </div>
    ${categoryError ? `<p class="error-text" style="margin-top:-12px;">${esc(categoryError)}</p>` : ""}
    ${rows}
  `;
}

/* ---------------- admin: registrations ---------------- */
let regFilter = "all";
function adminRegistrationsHTML(){
  const filtered = regFilter==="all" ? registrations : registrations.filter(r=>r.eventId===regFilter);
  const options = `<option value="all">All events</option>` + events.map(e=>`<option value="${e.id}" ${e.id===regFilter?"selected":""}>${esc(e.title)}</option>`).join("");

  const body = filtered.length===0
    ? `<div class="empty-state">No registrations match this view yet.</div>`
    : `<div class="table-wrap"><table>
        <thead><tr><th>Student</th><th>Email</th><th>Event</th><th>Date</th></tr></thead>
        <tbody>${filtered.map(r=>{
          const ev = events.find(e=>e.id===r.eventId);
          return `<tr><td>${esc(r.studentName)}</td><td>${esc(r.studentEmail)}</td><td>${ev?esc(ev.title):"—"}</td><td>${ev?formatDate(ev.date):"—"}</td></tr>`;
        }).join("")}</tbody>
      </table></div>`;

  return `
    <div class="section-header">
      <div><div class="section-eyebrow mono">Overview</div><h2 class="section-title">Event registrations</h2></div>
      <select id="reg-filter" style="width:220px;">${options}</select>
    </div>
    ${body}
  `;
}

/* ---------------- admin: announcements ---------------- */
let annTitle = "", annBody = "", annError = "";
function adminAnnouncementsHTML(){
  const list = announcements.map(a=>`
    <div class="announcement">
      <div class="announcement-top">
        <div><h4>${esc(a.title)}</h4><span class="date mono">${formatDate(a.date)}</span></div>
        <button class="btn small btn-danger" data-remove-ann="${a.id}">Remove</button>
      </div>
      <p>${esc(a.body)}</p>
    </div>`).join("");

  return `
    <div class="section-header"><div><div class="section-eyebrow mono">Manage</div><h2 class="section-title">Announcements</h2></div></div>
    <div class="panel">
      <label class="field"><span class="field-label">Title</span><input id="ann-title" value="${esc(annTitle)}" placeholder="Registrations open for Hackathon"></label>
      <label class="field"><span class="field-label">Message</span><textarea id="ann-body" placeholder="Details students need to know">${esc(annBody)}</textarea></label>
      ${annError ? `<p class="error-text">${esc(annError)}</p>` : ""}
      <button class="btn btn-primary" id="post-ann-btn">Post announcement</button>
    </div>
    ${list}
  `;
}

/* ---------------- admin: participant lists ---------------- */
let participantsEventId = events[0] ? events[0].id : "";
function adminParticipantsHTML(){
  if(!events.find(e=>e.id===participantsEventId)) participantsEventId = events[0] ? events[0].id : "";
  const ev = events.find(e=>e.id===participantsEventId);
  const list = registrations.filter(r=>r.eventId===participantsEventId);
  const options = events.map(e=>`<option value="${e.id}" ${e.id===participantsEventId?"selected":""}>${esc(e.title)}</option>`).join("");

  const body = !ev ? `<div class="empty-state">Create an event first.</div>` : `
    <div class="panel" style="margin-bottom:0;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <div>
          <h3 style="margin-bottom:2px;">${esc(ev.title)}</h3>
          <span class="mono" style="font-size:12.5px;color:var(--ink-soft);">${list.length} of ${ev.capacity} spots filled</span>
        </div>
        <button class="btn small btn-ghost" id="copy-list-btn">Copy list</button>
      </div>
      ${list.length===0 ? `<div class="empty-state">No one has registered for this event yet.</div>` :
        `<ol class="participant-list">${list.map(r=>`<li>${esc(r.studentName)} <span class="participant-email mono">— ${esc(r.studentEmail)}</span></li>`).join("")}</ol>`}
    </div>`;

  return `
    <div class="section-header">
      <div><div class="section-eyebrow mono">Generate</div><h2 class="section-title">Participant lists</h2></div>
      <select id="participants-event" style="width:240px;">${options}</select>
    </div>
    ${body}
  `;
}

/* ---------------- student: browse ---------------- */
let browseQuery = "", browseCat = "all";
function isRegistered(eventId){ return registrations.some(r=>r.eventId===eventId && r.studentEmail===session.email); }
function spotsLeft(ev){ return ev.capacity - regCount(ev.id); }

function studentBrowseHTML(){
  const filtered = events
    .filter(e => browseCat==="all" ? true : e.category===browseCat)
    .filter(e => e.title.toLowerCase().includes(browseQuery.toLowerCase()))
    .sort((a,b)=> new Date(a.date) - new Date(b.date));

  const catOptions = `<option value="all">All categories</option>` + categories.map(c=>`<option value="${esc(c)}" ${c===browseCat?"selected":""}>${esc(c)}</option>`).join("");

  const cards = filtered.length===0
    ? `<div class="empty-state">No events match your search.</div>`
    : filtered.map(ev=>{
        const left = spotsLeft(ev);
        const registered = isRegistered(ev.id);
        const infoClass = (left<=0 && !registered) ? "ticket-info warn mono" : "ticket-info mono";
        const infoText = left<=0 ? "Full" : `${left} spot${left===1?"":"s"} left`;
        const actionBtn = registered
          ? `<button class="btn small btn-ghost" data-unregister="${ev.id}">Cancel registration</button>`
          : `<button class="btn small ${left<=0?'btn-ghost':'btn-primary'}" data-register="${ev.id}" ${left<=0?"disabled":""}>Register</button>`;
        return ticketCardHTML(ev, `<span class="${infoClass}">${infoText}</span><div class="spacer"></div>${actionBtn}`);
      }).join("");

  return `
    <div class="section-header"><div><div class="section-eyebrow mono">Discover</div><h2 class="section-title">Upcoming events</h2></div></div>
    <div class="filters-row">
      <input id="browse-query" placeholder="Search events" value="${esc(browseQuery)}">
      <select id="browse-cat">${catOptions}</select>
    </div>
    ${cards}
  `;
}

/* ---------------- student: schedule ---------------- */
function studentScheduleHTML(){
  const mine = registrations
    .filter(r=>r.studentEmail===session.email)
    .map(r=>events.find(e=>e.id===r.eventId))
    .filter(Boolean)
    .sort((a,b)=> new Date(a.date) - new Date(b.date));

  const cards = mine.length===0
    ? `<div class="empty-state">You haven't registered for any events yet — head to Browse events.</div>`
    : mine.map(ev => ticketCardHTML(ev, `<div class="spacer"></div><button class="btn small btn-danger" data-unregister="${ev.id}">Cancel registration</button>`)).join("");

  return `
    <div class="section-header"><div><div class="section-eyebrow mono">Personal</div><h2 class="section-title">My schedule</h2></div></div>
    ${cards}
  `;
}

/* ---------------- student: announcements ---------------- */
function studentAnnouncementsHTML(){
  const list = announcements.length===0
    ? `<div class="empty-state">No announcements right now.</div>`
    : announcements.map(a=>`
      <div class="announcement">
        <h4>${esc(a.title)}</h4>
        <span class="date mono">${formatDate(a.date)}</span>
        <p>${esc(a.body)}</p>
      </div>`).join("");
  return `
    <div class="section-header"><div><div class="section-eyebrow mono">Notices</div><h2 class="section-title">Announcements</h2></div></div>
    ${list}
  `;
}

/* ---------------- event handlers ---------------- */
function attachMainHandlers(){
  const el = document.getElementById("main-col");

  if(session.role==="admin" && adminTab==="events"){
    const newBtn = document.getElementById("new-event-btn");
    if(newBtn) newBtn.addEventListener("click", ()=>{ eventForm=emptyEventForm(); eventFormError=""; editingEventId="new"; renderMain(); });

    el.querySelectorAll("[data-edit]").forEach(b=> b.addEventListener("click", ()=>{
      const ev = events.find(e=>e.id===b.dataset.edit);
      eventForm = {...ev}; eventFormError=""; editingEventId = ev.id; renderMain();
    }));
    el.querySelectorAll("[data-delete]").forEach(b=> b.addEventListener("click", ()=>{
      events = events.filter(e=>e.id!==b.dataset.delete); renderMain();
    }));

    const saveBtn = document.getElementById("f-save");
    if(saveBtn) saveBtn.addEventListener("click", ()=>{
      eventForm.title = document.getElementById("f-title").value;
      eventForm.club = document.getElementById("f-club").value;
      eventForm.category = document.getElementById("f-category").value;
      eventForm.capacity = document.getElementById("f-capacity").value;
      eventForm.date = document.getElementById("f-date").value;
      eventForm.time = document.getElementById("f-time").value;
      eventForm.venue = document.getElementById("f-venue").value;
      eventForm.description = document.getElementById("f-description").value;

      if(!eventForm.title.trim() || !eventForm.date || !eventForm.time || !eventForm.venue.trim()){
        eventFormError = "Title, date, time, and venue are required.";
        renderMain();
        return;
      }
      const capacity = Number(eventForm.capacity) || 0;
      if(editingEventId==="new"){
        events = [{...eventForm, id: uid("ev"), capacity}, ...events];
      } else {
        events = events.map(e=> e.id===editingEventId ? {...eventForm, id: editingEventId, capacity} : e);
      }
      editingEventId = null;
      renderMain();
    });
    const cancelBtn = document.getElementById("f-cancel");
    if(cancelBtn) cancelBtn.addEventListener("click", ()=>{ editingEventId=null; renderMain(); });
  }

  if(session.role==="admin" && adminTab==="categories"){
    document.getElementById("add-cat-btn").addEventListener("click", addCategory);
    document.getElementById("new-cat-name").addEventListener("keydown", (e)=>{ if(e.key==="Enter") addCategory(); });
    el.querySelectorAll("[data-remove-cat]").forEach(b=> b.addEventListener("click", ()=>{
      categories = categories.filter(c=>c!==b.dataset.removeCat); renderMain();
    }));
  }

  if(session.role==="admin" && adminTab==="registrations"){
    document.getElementById("reg-filter").addEventListener("change",(e)=>{ regFilter = e.target.value; renderMain(); });
  }

  if(session.role==="admin" && adminTab==="announcements"){
    document.getElementById("post-ann-btn").addEventListener("click", ()=>{
      annTitle = document.getElementById("ann-title").value;
      annBody = document.getElementById("ann-body").value;
      if(!annTitle.trim() || !annBody.trim()){ annError="Add a title and message before posting."; renderMain(); return; }
      announcements = [{id:uid("an"), title:annTitle.trim(), body:annBody.trim(), date:new Date().toISOString().slice(0,10)}, ...announcements];
      annTitle=""; annBody=""; annError="";
      renderMain();
    });
    el.querySelectorAll("[data-remove-ann]").forEach(b=> b.addEventListener("click", ()=>{
      announcements = announcements.filter(a=>a.id!==b.dataset.removeAnn); renderMain();
    }));
  }

  if(session.role==="admin" && adminTab==="participants"){
    const sel = document.getElementById("participants-event");
    if(sel) sel.addEventListener("change",(e)=>{ participantsEventId = e.target.value; renderMain(); });
    const copyBtn = document.getElementById("copy-list-btn");
    if(copyBtn) copyBtn.addEventListener("click", ()=>{
      const list = registrations.filter(r=>r.eventId===participantsEventId);
      const text = list.map((r,i)=>`${i+1}. ${r.studentName} — ${r.studentEmail}`).join("\n") || "No participants yet.";
      if(navigator.clipboard) navigator.clipboard.writeText(text);
    });
  }

  if(session.role==="student" && studentTab==="browse"){
    document.getElementById("browse-query").addEventListener("input",(e)=>{ browseQuery=e.target.value; renderMain(); });
    document.getElementById("browse-cat").addEventListener("change",(e)=>{ browseCat=e.target.value; renderMain(); });
    el.querySelectorAll("[data-register]").forEach(b=> b.addEventListener("click", ()=>{
      const ev = events.find(e=>e.id===b.dataset.register);
      if(isRegistered(ev.id) || spotsLeft(ev)<=0) return;
      registrations = [...registrations, {id:uid("reg"), eventId:ev.id, studentName:session.name, studentEmail:session.email}];
      renderMain();
    }));
    el.querySelectorAll("[data-unregister]").forEach(b=> b.addEventListener("click", ()=>{
      const evId = b.dataset.unregister;
      registrations = registrations.filter(r=>!(r.eventId===evId && r.studentEmail===session.email));
      renderMain();
    }));
  }

  if(session.role==="student" && studentTab==="schedule"){
    el.querySelectorAll("[data-unregister]").forEach(b=> b.addEventListener("click", ()=>{
      const evId = b.dataset.unregister;
      registrations = registrations.filter(r=>!(r.eventId===evId && r.studentEmail===session.email));
      renderMain();
    }));
  }
}

function addCategory(){
  const input = document.getElementById("new-cat-name");
  const trimmed = input.value.trim();
  if(!trimmed){ categoryError="Enter a category name."; renderMain(); return; }
  if(categories.some(c=>c.toLowerCase()===trimmed.toLowerCase())){ categoryError="That category already exists."; renderMain(); return; }
  categories = [...categories, trimmed];
  categoryError="";
  renderMain();
}
</script>
</body>
</html>
